<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #00e5ff;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0, 0, 0, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    text-align: center;
    background: transparent;
    padding: 6px 12px;
  }
  .clock {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.15;
    margin-bottom: 4px;
  }
  .date {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.25;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
  </div>

  <script>
    const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    function updateTime() {
      const now = new Date();
      const dayName = days[now.getDay()];
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();

      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      document.getElementById("clock").textContent = `${hh}:${min}:${ss}`;
      document.getElementById("date").textContent = `${dayName}, ${dd}/${mm}/${yyyy}`;
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
